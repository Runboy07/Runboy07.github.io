<!DOCTYPE html>
<html lang="en">
<head>
<title>Contact – Your Name</title>
<meta name="description" content="Get in touch with Your Name.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Your Name</a>
    <nav aria-label="Main">
      <a href="index.html">home</a>
      <a href="projects.html">projects</a>
      <a href="experience.html">experience</a>
      <a href="resume.html">resume</a>
      <a href="contact.html" aria-current="page">contact</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">
    <h1 class="page-title">contact</h1>
    <p class="lede">I'm open to freelance work and full-time roles. Send me a note and I'll reply within a couple of days.</p>
    <!-- Setup: create a free form at formspree.io, then replace YOUR_FORM_ID below with your form's ID.
         Messages are emailed to the address you registered there, so your email never appears on this page. -->
    <form class="form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="field">
        <label for="name">name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <!-- Spam trap: leave hidden and empty -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
      <button class="btn" type="submit" id="send">send message</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <ul class="contact-list">
      <li><span>github</span><a href="https://github.com/your-username">github.com/your-username</a></li>
      <li><span>linkedin</span><a href="https://www.linkedin.com/in/your-username">linkedin.com/in/your-username</a></li>
    </ul>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="year">2026</span> Your Name</span>
    <span><a href="https://github.com/your-username">github</a> &nbsp; <a href="https://www.linkedin.com/in/your-username">linkedin</a></span>
  </div>
</footer>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
<script>
  const form = document.getElementById("contact-form");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    send.disabled = true;
    status.className = "status";
    status.textContent = "sending...";
    try {
      const res = await fetch(form.action, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error();
      form.reset();
      status.className = "status ok";
      status.textContent = "Thanks! Your message was sent.";
    } catch (err) {
      status.className = "status err";
      status.textContent = "Something went wrong. Please try again in a moment.";
    } finally {
      send.disabled = false;
    }
  });
</script>
</body>
</html>
